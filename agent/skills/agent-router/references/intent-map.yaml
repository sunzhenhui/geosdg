# GeoSDG Agent 意图映射表 / Intent Map
# 意图 → Skill/Tool 路由规则
# 优先级数字越小越先匹配（1=最高，10=兜底）

version: "1.0"

intents:
  # ── SDG 指标计算 ──
  sdg-calc:
    priority: 1
    description: "用户需要计算某个 SDG 空间化指标"
    patterns:
      - regex: "(?i)sdg\\s*\\d|可持续.{0,10}目标|指标计算|指标评估"
      - regex: "(?i)sgd\\s*\\d|目标\\s*\\d{1,2}"  # 宽松匹配：sgd/目标11
      - keywords:
          - 土地变化
          - 城市增长
          - 碳达峰
          - 水体变化
          - 缓冲区
          - 人口增长
          - 排放
          - 森林覆盖
          - 耕地面积
          - 土地退化
      - composite_keywords:  # 需结合区域名或动作词
          - 评估
          - 分析
          - 计算
          - 算一下
    target_skills:
      - sdg-indicator-knowledge
    target_tools:
      - sdg-land-proportion
      - sdg-land-conversion
      - sdg-buffer-zone
      - sdg-1131
      - sdg-1322
    rag_query_hint: "SDG {matched_number} 指标定义 计算公式 数据要求"
    routing_flow:
      - "[RAG] 检索知识库获取指标定义、公式、参数推荐"
      - "加载 sdg-indicator-knowledge 查询指标公式和参数"
      - "加载 agent-planner 规划计算链"
      - "调用 agent-executor 执行对应 Tool"

  # ── CA 精度评估 ──
  ca-precision:
    priority: 2
    description: "用户需要评估 CA 模拟精度或进行统计检验"
    patterns:
      - keywords:
          - 精度
          - 准确率
          - FoM
          - Kappa
          - 验证
          - 模拟结果
          - 像元
          - 相关性
          - t检验
          - t-test
      - composite_keywords:
          - 对不对
          - 准不准
          - 好不好
          - 靠谱吗
    target_tools:
      - ca-precision
      - correlation
      - t-test
    rag_query_hint: "CA 模拟精度 FoM Kappa 评估方法"
    routing_flow:
      - "[RAG] 检索知识库获取精度评估方法和参数"
      - "加载 agent-planner 规划验证步骤"
      - "调用 agent-executor 执行 ca-precision / correlation / t-test"

  # ── 优先区域识别 ──
  priority:
    priority: 3
    description: "用户需要识别优先保护/重点区域"
    patterns:
      - keywords:
          - 优先区域
          - 热点
          - 重点区
          - 保护
          - 优先保护
          - 排名
          - 合并
          - 侵蚀
          - 人地关系
          - 排放未达峰
    target_tools:
      - priority-loss
      - priority-transition
      - priority-buffer
      - priority-emission
      - priority-human-land
      - priority-merge
    rag_query_hint: "优先区域识别 保护热点 排名规则"
    routing_flow:
      - "[RAG] 检索知识库获取优先区域规则和案例"
      - "加载 agent-planner 规划规则执行链"
      - "调用 agent-executor 依次执行 Rule 1-6"
      - "调用 agent-executor 执行 priority-merge 生成排名图"

  # ── 知识查询（纯检索，不调用 CLI） ──
  knowledge:
    priority: 4
    description: "用户查询 SDG 指标定义、论文辅助或操作问题"
    patterns:
      - regex: "(?i)什么是|定义|含义|解释|介绍|说明|怎么算|怎么用|如何使用"
      - keywords:
          - 审稿
          - 论文修改
          - SDG 框架
          - 指标清单
          - 指标体系
          - 帮助
    target_skills:
      - sdg-indicator-knowledge
      - paper-revision-workflow
      - geosdg-assistant
    no_tool_calls: true  # 纯检索对话，不调用 CLI Tool
    rag_query_hint: "SDG 指标定义 公式 方法论"
    routing_flow:
      - "[RAG] 检索知识库获取指标定义和方法论"
      - "加载 sdg-indicator-knowledge 或 paper-revision-workflow"
      - "纯知识检索对话，返回文字说明"

  # ── 报告生成与导出 ──
  report:
    priority: 5
    description: "用户需要生成、导出或校验评估报告"
    patterns:
      - keywords:
          - 生成报告
          - 导出报告
          - 出报告
          - 写报告
          - PDF报告
          - HTML报告
          - 校验报告
          - 报告校验
          - 报告验证
      - regex: "(?i)report|generate.report|export.report"
      - composite_keywords:
          - 报告
          - 导出
          - PDF
          - HTML
    target_skills:
      - agent-report
    target_tools:
      - generate-report
      - generate-charts
    rag_query_hint: "GeoSDG 报告生成 模板 导出 校验"
    routing_flow:
      - "加载 agent-report skill 获取报告策略"
      - "调用 generate-charts 生成图表（如未提供）"
      - "调用 generate-report 渲染 Markdown 报告"
      - "运行 report_validator 校验报告"
      - "按需调用 report_exporter 导出 HTML/PDF"

  # ── 综合评估（兜底） ──
  composite:
    priority: 10  # 兜底
    description: "模糊或多步骤需求，需规划器综合分析"
    patterns:
      - keywords:
          - 全面
          - 综合
          - 整体
          - 系统
          - 完整
          - 帮我分析
          - 帮我做
          - 帮我评估
    target_skills:
      - agent-planner
    note: "规划器决定调用哪些 Skill 和 Tool，可能串联多个类别"
    rag_query_hint: "综合评估 区域分析 SDG 多指标"
    routing_flow:
      - "[RAG] 检索知识库获取相关指标和案例"
      - "加载 agent-planner 进行综合分析"
      - "规划器自主决定调用哪些 Tool"

# ── 路由决策规则 ──
routing_rules:
  - rule: "优先级匹配"
    description: "按 priority 数字从小到大依次匹配，首个命中即返回"
  - rule: "多模式叠加"
    description: "同一意图的 regex / keywords / composite_keywords 任一命中即归入该意图"
  - rule: "composite_keywords 需上下文"
    description: "composite_keywords 单独出现不触发，需结合区域名或数据描述"
  - rule: "knowledge 优先于 no_tool_calls"
    description: "如果同时匹配 ca-precision 和 knowledge，且用户语气为询问（含'是什么''定义'），归入 knowledge"
  - rule: "模糊兜底"
    description: "所有意图均未命中时，归入 composite，由规划器引导用户澄清需求"
  - rule: "宽松 SDG 引用"
    description: "sdg 11 / SDG11.3 / 目标11 / sgd 11.3.1 等不规范写法均能命中 sdg-calc"

# ── 测试语句（每类 3 条） ──
test_cases:
  sdg-calc:
    - "算一下 SDG 15.3.1"
    - "帮我评估杭州湾地区 SDG 11.3.1 的城市增长效率"
    - "sgd 11 这个指标怎么算"
  ca-precision:
    - "这个模拟准不准"
    - "帮我评估一下这份模拟结果精度"
    - "验证下 CA 模拟的 Kappa 值"
  priority:
    - "还有哪些地方需要优先保护"
    - "帮我找出热点区域"
    - "把 6 条规则的结果合并成排名图"
  knowledge:
    - "SDG 6.6.1 是什么指标"
    - "FoM 的定义是什么"
    - "审稿意见说指标设计不合理，怎么回复"
  report:
    - "帮我生成杭州的综合评估报告"
    - "导出 PDF 报告"
    - "校验一下报告有没有问题"
  composite:
    - "帮我完整分析一下北京"
    - "全面评估长三角地区的可持续发展情况"
    - "帮我做一套完整的 SDG 评估"
